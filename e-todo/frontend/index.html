<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-todo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="auth-section" class="container">
        <div class="auth-card">
            <h1>e-todo</h1>
            
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="showLogin()">connexion</button>
                <button class="tab-btn" onclick="showRegister()">inscription</button>
            </div>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Mot de passe</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn btn-primary">Se connecter</button>
                <div id="login-error" class="error-msg"></div>
            </form>

            <form id="register-form" class="auth-form hidden">
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label for="register-firstname">Prenom</label>
                    <input type="text" id="register-firstname" required>
                </div>
                <div class="form-group">
                    <label for="register-name">Nom</label>
                    <input type="text" id="register-name" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Mot de passe</label>
                    <input type="password" id="register-password" required>
                </div>
                <button type="submit" class="btn btn-primary">Creer un compte</button>
                <div id="register-error" class="error-msg"></div>
            </form>
        </div>
    </div>

    <div id="app-section" class="container hidden">
        <header class="header">
            <div class="header-left">
                <h1>e-todo</h1>
                <span id="user-info"></span>
            </div>
            <button onclick="logout()" class="btn btn-secondary btn-sm">deconnexion</button>
        </header>

        <div class="add-section">
            <h2>Nouvelle tache</h2>
            <form id="add-todo-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="todo-title">Titre</label>
                        <input type="text" id="todo-title" required>
                    </div>
                    <div class="form-group">
                        <label for="todo-due">Echeance</label>
                        <input type="datetime-local" id="todo-due" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="todo-desc">Description</label>
                    <textarea id="todo-desc" required rows="2"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="todo-status">Statut</label>
                        <select id="todo-status">
                            <option value="not started">non commencé</option>
                            <option value="todo">a faire</option>
                            <option value="in progress">en cours</option>
                            <option value="done">termine</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">Ajouter</button>
                </div>
            </form>
        </div>


        <div class="filters">
            <button class="filter-btn active" data-filter="all">toutes</button>
            <button class="filter-btn" data-filter="not started">non commence</button>
            <button class="filter-btn" data-filter="todo">a faire</button>
            <button class="filter-btn" data-filter="in progress">en cours</button>
            <button class="filter-btn" data-filter="done">termine</button>
        </div>

        <div class="todos-section">
            <h2>Taches</h2>
            <div id="todos-list"></div>
        </div>
    </div>

    <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Modifier</h2>
                <button class="close" onclick="closeModal()">&times;</button>
            </div>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label for="edit-title">Titre</label>
                    <input type="text" id="edit-title" required>
                </div>
                <div class="form-group">
                    <label for="edit-desc">Description</label>
                    <textarea id="edit-desc" required rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-due">Echeance</label>
                    <input type="datetime-local" id="edit-due" required>
                </div>
                <div class="form-group">
                    <label for="edit-status">Statut</label>
                    <select id="edit-status">
                        <option value="not started">non commence</option>
                        <option value="todo">a faire</option>
                        <option value="in progress">en cours</option>
                        <option value="done">termine</option>
                    </select>
                </div>
                <div class="modal-btns">
                    <button type="button" onclick="closeModal()" class="btn btn-secondary">Annuler</button>
                    <button type="submit" class="btn">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
